<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Property | Silverline Properties</title><link rel="stylesheet" href="../style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script></head><body class="admin-body"><header class="site-header admin-header"><a class="brand admin-brand" href="index.html"><img src="../assets/silverline-logo.png" alt="Silverline Co logo"><span class="brand-text"><b>SILVERLINE</b><small>STAFF</small></span></a><div class="admin-actions"><a class="button outline" href="index.html">Dashboard</a><button class="button" id="logout">Sign out</button></div></header><main class="admin-shell"><div class="admin-top"><div><p class="eyebrow">STAFF ADMINISTRATION</p><h1>Add New Property</h1><p>Create a public Silverline property listing.</p></div></div><div id="status" class="status"></div><form id="propertyForm" class="admin-card form-grid"><div class="form-row"><div class="field"><label for="name">Name *</label><input id="name" maxlength="120" required></div><div class="field"><label for="price">Price *</label><div class="price-input"><select id="currency" aria-label="Currency"><option value="$">$</option><option value="£">£</option></select><input id="price" type="number" min="0" step="0.01" required></div></div></div><div class="field"><label for="description">Description *</label><textarea id="description" maxlength="5000" required></textarea></div><div class="field"><label>Images *</label><label id="dropzone" class="dropzone" for="images"><input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple><strong>Drop images here</strong><br><span class="small">or click to choose JPG, PNG or WEBP images · max 8 MB each</span></label><div id="previews" class="previews"></div></div><button class="button" type="submit">Publish Property</button></form></main><script src="auth.js"></script><script>let files=[];const dz=document.getElementById('dropzone'),input=document.getElementById('images'),prev=document.getElementById('previews'),st=document.getElementById('status');document.getElementById('logout').addEventListener('click',signOut);function msg(t,c='error'){st.textContent=t;st.className='status show '+c;window.scrollTo({top:0,behavior:'smooth'})}function render(){prev.innerHTML='';files.forEach((f,i)=>{const d=document.createElement('div');d.className='preview';d.innerHTML=`<img alt="Preview ${i+1}"><button type="button" aria-label="Remove image">×</button>`;d.querySelector('img').src=URL.createObjectURL(f);d.querySelector('button').onclick=()=>{files.splice(i,1);render()};prev.appendChild(d)})}function add(list){for(const f of list){if(!['image/jpeg','image/png','image/webp'].includes(f.type))return msg('Only JPG, PNG and WEBP images are allowed.');if(f.size>8*1024*1024)return msg(`${f.name} is larger than 8 MB.`);if(files.length>=12)break;files.push(f)}render()}input.addEventListener('change',e=>add(e.target.files));['dragenter','dragover'].forEach(x=>dz.addEventListener(x,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(x=>dz.addEventListener(x,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>add(e.dataTransfer.files));async function init(){const r=await requireStaff();if(r.redirect)return location.href='login.html';if(!r.ok)return msg(r.error)}init();document.getElementById('propertyForm').addEventListener('submit',async e=>{e.preventDefault();if(!supabaseClient)return msg('Supabase is not configured.');if(!files.length)return msg('Add at least one property image.');const r=await requireStaff();if(!r.ok)return msg('Your staff session is no longer valid.');st.className='status';const propertyId=crypto.randomUUID();const urls=[];const uploaded=[];try{for(const f of files){const ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg';const path=`properties/${propertyId}/${crypto.randomUUID()}.${ext}`;const {error}=await supabaseClient.storage.from('property-images').upload(path,f,{contentType:f.type,cacheControl:'31536000',upsert:false});if(error)throw error;uploaded.push(path);const {data}=supabaseClient.storage.from('property-images').getPublicUrl(path);urls.push(data.publicUrl)}const {error}=await supabaseClient.from('properties').insert({id:propertyId,name:name.value.trim(),price:Number(price.value),currency:currency.value,description:description.value.trim(),image_urls:urls,created_by:r.user.id,published:true});if(error)throw error;msg('Property published successfully. It is now visible on the public Properties page.','success');e.target.reset();files=[];render();}catch(err){if(uploaded.length)await supabaseClient.storage.from('property-images').remove(uploaded);console.error(err);msg(err.message||'Upload failed. No property was published.')}});</script></body></html>
