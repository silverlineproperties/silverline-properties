<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Login | Silverline Properties</title><link rel="stylesheet" href="../style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script></head><body class="admin-body"><main class="login-page"><section class="login-card"><img class="login-logo" src="../assets/silverline-logo.png" alt="Silverline Co logo"><p class="eyebrow">SILVERLINE PROPERTIES</p><h1>Staff Login</h1><p>Sign in to manage the property collection.</p><div id="status" class="status"></div><form id="loginForm" class="form-grid"><div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="button" type="submit">Sign in</button></form><p class="small">Staff accounts are created by the Silverline administrator.</p></section></main><script>const cfg=window.SILVERLINE_CONFIG||{};const client=cfg.supabaseUrl&&!cfg.supabaseUrl.includes('YOUR_')?window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;const s=document.getElementById('status');function msg(t,c='error'){s.textContent=t;s.className='status show '+c}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!client)return msg('Supabase is not configured yet. Add your project URL and publishable key to config.js.');const {error}=await client.auth.signInWithPassword({email:email.value,password:password.value});if(error)return msg('Sign in failed. Check your email and password.');const {data}=await client.rpc('is_staff');if(!data){await client.auth.signOut();return msg('This account is not authorised as Silverline staff.')}location.href='index.html'});</script></body></html>
