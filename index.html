<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Dashboard | Silverline Properties</title><link rel="stylesheet" href="../style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script></head><body class="admin-body"><header class="site-header admin-header"><a class="brand admin-brand" href="../index.html"><img src="../assets/silverline-logo.png" alt="Silverline Co logo"><span class="brand-text"><b>SILVERLINE</b><small>STAFF</small></span></a><div class="admin-actions"><a class="button outline" href="../index.html">Public site</a><button class="button" id="logout">Sign out</button></div></header><main class="admin-shell"><div class="admin-top"><div><p class="eyebrow">STAFF ADMINISTRATION</p><h1>Property Dashboard</h1><p>Manage the Silverline Properties collection.</p></div><a class="button" href="add.html">+ Add New Property</a></div><div id="status" class="status"></div><section class="admin-card"><h2>Existing Properties</h2><div id="tableWrap">Loading…</div></section></main><script src="auth.js"></script><script>const st=document.getElementById('status');const table=document.getElementById('tableWrap');document.getElementById('logout').addEventListener('click',signOut);async function init(){const r=await requireStaff();if(r.redirect)return location.href='login.html';if(!r.ok){st.textContent=r.error;st.className='status show error';return}const {data,error}=await supabaseClient.from('properties').select('*').order('created_at',{ascending:false});if(error){table.textContent='Unable to load properties.';return}if(!data.length){table.innerHTML='<p>No properties have been uploaded yet.</p>';return}table.innerHTML='<table class="admin-table"><thead><tr><th>Property</th><th>Price</th><th>Images</th><th>Created</th><th>Action</th></tr></thead><tbody>'+data.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.currency)}${Number(p.price).toLocaleString()}</td><td>${(p.image_urls||[]).length}</td><td>${new Date(p.created_at).toLocaleDateString()}</td><td><button class="button danger" onclick="removeProperty('${p.id}')">Delete</button></td></tr>`).join('')+'</tbody></table>'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function removeProperty(id){if(!confirm('Delete this property and its uploaded images?'))return;const {data:p}=await supabaseClient.from('properties').select('image_urls').eq('id',id).single();if(p?.image_urls?.length){const paths=p.image_urls.map(url=>{const marker='/storage/v1/object/public/property-images/';const i=url.indexOf(marker);return i>=0?decodeURIComponent(url.slice(i+marker.length)):null}).filter(Boolean);if(paths.length)await supabaseClient.storage.from('property-images').remove(paths)}const {error}=await supabaseClient.from('properties').delete().eq('id',id);if(error){st.textContent='Delete failed.';st.className='status show error'}else init()}init();</script></body></html>
